  <script>/* Optional, local-only behavior. The document owns its content and composition. */
(function () {
  "use strict";

  function initializeTabs(root) {
    const tabs = Array.from(root.querySelectorAll('[role="tab"]')).filter(
      (tab) => tab.closest("[data-report-tabs]") === root
    );
    const panels = tabs.map((tab) => document.getElementById(tab.getAttribute("aria-controls")));
    // Invalid author markup stays readable; do not hide partly connected panels.
    if (!tabs.length || panels.some((panel) => !panel || !root.contains(panel))) return;
    if (tabs.some((tab) => !tab.id || !tab.closest('[role="tablist"]'))) return;
    if (panels.some((panel) => panel.getAttribute("role") !== "tabpanel")) return;
    if (new Set(panels).size !== panels.length) return;

    function selectTab(selected, focus) {
      tabs.forEach((tab, index) => {
        const active = tab === selected;
        tab.setAttribute("aria-selected", String(active));
        tab.tabIndex = active ? 0 : -1;
        panels[index].hidden = !active;
      });
      if (focus) selected.focus();
    }

    tabs.forEach((tab, index) => {
      tab.addEventListener("click", () => selectTab(tab, false));
      tab.addEventListener("keydown", (event) => {
        const vertical = tab.closest('[role="tablist"]').getAttribute("aria-orientation") === "vertical";
        const previous = vertical ? "ArrowUp" : "ArrowLeft";
        const next = vertical ? "ArrowDown" : "ArrowRight";
        let selected = index;
        if (event.key === previous) selected = (index - 1 + tabs.length) % tabs.length;
        else if (event.key === next) selected = (index + 1) % tabs.length;
        else if (event.key === "Home") selected = 0;
        else if (event.key === "End") selected = tabs.length - 1;
        else return;
        event.preventDefault();
        selectTab(tabs[selected], true);
      });
    });
    selectTab(tabs.find((tab) => tab.getAttribute("aria-selected") === "true") || tabs[0], false);
    root.dataset.reportReady = "true";
  }

  function initializeCopy(button) {
    const target = document.getElementById(button.dataset.copyTarget);
    const status = document.getElementById(button.dataset.copyStatus);
    if (!target || !status) return;
    let fallback;
    button.addEventListener("click", async () => {
      const value = ("value" in target ? target.value : target.textContent).trim();
      try {
        if (!navigator.clipboard) throw new Error("Clipboard unavailable");
        await navigator.clipboard.writeText(value);
        if (fallback) fallback.hidden = true;
        status.textContent = button.dataset.copySuccess || "Copied.";
      } catch (_) {
        // file:// clipboard permission varies. Keep an explicit manual path.
        if (!fallback) {
          fallback = document.createElement("textarea");
          fallback.className = "textarea report-copy-fallback";
          fallback.readOnly = true;
          fallback.setAttribute("aria-label", button.dataset.copyLabel || "Text to copy");
          status.insertAdjacentElement("afterend", fallback);
        }
        fallback.value = value;
        fallback.hidden = false;
        fallback.focus();
        fallback.select();
        status.textContent = button.dataset.copyFallback || "Select this text and copy it manually.";
      }
    });
  }

  function initializeFilters() {
    const groups = new Map();
    document.querySelectorAll("[data-report-filter]").forEach((control) => {
      const target = document.getElementById(control.dataset.reportFilter);
      if (!target || !control.dataset.filterKey) return;
      if (!groups.has(target)) groups.set(target, []);
      groups.get(target).push(control);
    });
    groups.forEach((controls, target) => {
      const items = Array.from(target.querySelectorAll("[data-filter-item]"));
      const counts = Array.from(document.querySelectorAll("[data-filter-count]")).filter(
        (count) => count.dataset.filterCount === target.id
      );
      function update() {
        let visible = 0;
        items.forEach((item) => {
          const matches = controls.every((control) => {
            const key = "filter" + control.dataset.filterKey.charAt(0).toUpperCase() +
              control.dataset.filterKey.slice(1);
            return !control.value || item.dataset[key] === control.value;
          });
          item.hidden = !matches;
          if (matches) visible += 1;
        });
        counts.forEach((count) => {
          count.textContent = (count.dataset.filterLabel || "Shown") + ": " + visible + " / " + items.length;
        });
      }
      controls.forEach((control) => control.addEventListener("change", update));
      update();
    });
  }

  function revealAnchor() {
    let id;
    try { id = decodeURIComponent(location.hash.slice(1)); } catch (_) { return; }
    const target = id && document.getElementById(id);
    if (!target) return;
    let ancestor = target;
    while (ancestor) {
      if (ancestor.tagName === "DETAILS") ancestor.open = true;
      if (ancestor.getAttribute("role") === "tabpanel" && ancestor.hidden) {
        const tabs = Array.from(document.querySelectorAll('[role="tab"]'));
        const tab = tabs.find((item) => item.getAttribute("aria-controls") === ancestor.id);
        if (tab) tab.click();
      }
      ancestor = ancestor.parentElement;
    }
    target.scrollIntoView({ block: "start" });
  }

  document.querySelectorAll("[data-report-tabs]").forEach(initializeTabs);
  document.querySelectorAll("[data-copy-target]").forEach(initializeCopy);
  initializeFilters();
  document.addEventListener("click", (event) => {
    const link = event.target.closest('a[href^="#"]');
    if (link && link.getAttribute("href").length > 1) {
      // Re-open evidence even when a user follows the same anchor twice.
      setTimeout(revealAnchor, 0);
    }
  });
  window.addEventListener("hashchange", revealAnchor);
  if (location.hash) revealAnchor();

  let printDetails = null;
  window.addEventListener("beforeprint", () => {
    if (printDetails) return;
    printDetails = new Map();
    document.querySelectorAll("details").forEach((details) => {
      printDetails.set(details, details.open);
      details.open = true;
    });
  });
  window.addEventListener("afterprint", () => {
    if (!printDetails) return;
    printDetails.forEach((open, details) => { details.open = open; });
    printDetails = null;
  });
  document.documentElement.dataset.reportUiReady = "true";
})();
</script>
